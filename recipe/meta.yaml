{% set name = "diffpy.apps" %}
{% set version = "0.2.2" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/d/diffpy_apps/diffpy_apps-0.2.2.tar.gz
  sha256: eb27ab8e17b8e05d78dfebe3a0662d44edd910a8ef9ef192549445a5b0f9f3f2

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed .
  entry_points:
    -  diffpy-app = diffpy.apps.apps:main
    -  diffpy-apps = diffpy.apps.apps:main

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - setuptools-git-versioning >=2.0
    - pip

  run:
    - python >={{ python_min }}
    - diffpy.srfit
    - diffpy.srreal
    - diffpy.structure
    - numpy
    - scipy
    - textx
    - psutil
    - pyyaml
    - networkx
    - mcp


test:
  requires:
    - python {{ python_min }}
    - pip
    - pytest
    - pytest-mock
    - pytest-env

  source_files:
    - tests

  commands:
    - pip check
    - pytest

about:
  home: https://github.com/diffpy.apps/diffpy.apps/
  summary: Python package for doing science.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.rst
  description: |
    User applications to help with tasks using diffpy packages. Currently it provides: 1. Macro interface for PDF refinements. 2. Agent interface for PDF refinements.
  doc_url: http://diffpy.apps.github.io/diffpy.apps/
  dev_url: https://github.com/diffpy.apps/diffpy.apps/

extra:
  recipe-maintainers:
    - sbillinge
